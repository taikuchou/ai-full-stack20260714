<p-toast />

<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand">
      <i class="pi pi-th-large logo-mark"></i>
      <span class="logo-text">CMS</span>
    </div>
    <h1>登入</h1>

    <div class="field">
      <label for="userId">帳號 <span class="req">*</span></label>
      <input
        id="userId"
        pInputText
        type="text"
        formControlName="userId"
        autocomplete="username"
        placeholder="請輸入帳號"
        [class.ng-invalid-visual]="invalid('userId')"
      />
      @if (invalid('userId')) {
        <small class="err">帳號為必填。</small>
      }
    </div>

    <div class="field">
      <label for="password">密碼 <span class="req">*</span></label>
      <p-password
        inputId="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="請輸入密碼"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
      />
      @if (invalid('password')) {
        <small class="err">密碼為必填。</small>
      }
    </div>

    <p-button
      type="submit"
      label="登入"
      icon="pi pi-sign-in"
      [loading]="submitting()"
      styleClass="w-full"
    />
  </form>
</div>
