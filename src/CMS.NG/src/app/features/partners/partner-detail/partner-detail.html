<div class="page-header">
  <div class="page-title">
    <h1>檢視合作廠商</h1>
  </div>
  <div class="page-actions">
    <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (onClick)="back()" />
    <p-button label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
  </div>
</div>

@if (loading()) {
  <div class="loading">載入中…</div>
} @else if (partner(); as p) {
  <div class="detail-card">
    <h2>廠商資料</h2>
    <dl class="detail-grid">
      <dt>主代碼</dt>
      <dd>{{ p.pkid }}</dd>

      <dt>廠商名稱</dt>
      <dd>{{ p.name }}</dd>

      <dt>應用代碼</dt>
      <dd>{{ p.appKey }}</dd>

      <dt>選單顯示名稱</dt>
      <dd>{{ p.nameOnPartnerMenu }}</dd>

      <dt>課程頁顯示名稱</dt>
      <dd>{{ p.nameOnCourseDetailPage }}</dd>

      <dt>顯示順序</dt>
      <dd>{{ p.displayOrder }}</dd>

      <dt>圖檔名稱</dt>
      <dd>{{ p.imageFilename || '—' }}</dd>
    </dl>
  </div>
} @else {
  <div class="loading">查無此合作廠商。</div>
}
