<p-toast />
<p-confirmDialog />

<div class="page-card">
  <!-- Header toolbar -->
  <div class="page-header">
    <div class="page-title">
      <h1>合作廠商 Partner</h1>
      <span class="subtitle">課程合作廠商</span>
    </div>
    <div class="page-actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="openFilter()" />
      <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
    </div>
  </div>

  <!-- Data table -->
  <p-table
    [value]="partners()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    dataKey="pkid"
    styleClass="p-datatable-sm p-datatable-gridlines">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="name" class="key-col">廠商名稱 <p-sortIcon field="name" /></th>
        <th pSortableColumn="appKey" style="width: 9rem">應用代碼 <p-sortIcon field="appKey" /></th>
        <th pSortableColumn="nameOnPartnerMenu">選單顯示名稱 <p-sortIcon field="nameOnPartnerMenu" /></th>
        <th pSortableColumn="nameOnCourseDetailPage">
          課程頁顯示名稱 <p-sortIcon field="nameOnCourseDetailPage" />
        </th>
        <th pSortableColumn="displayOrder" style="width: 8rem">
          顯示順序 <p-sortIcon field="displayOrder" />
        </th>
        <th style="width: 9rem" class="text-center">操作</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-partner>
      <tr>
        <td>{{ partner.pkid }}</td>
        <td class="key-col">{{ partner.name }}</td>
        <td>{{ partner.appKey }}</td>
        <td>{{ partner.nameOnPartnerMenu }}</td>
        <td>{{ partner.nameOnCourseDetailPage }}</td>
        <td>{{ partner.displayOrder }}</td>
        <td class="text-center actions">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="檢視"
            (onClick)="view(partner)" />
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="編輯"
            (onClick)="edit(partner)" />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="刪除"
            (onClick)="confirmDelete(partner)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Filter drawer -->
<p-drawer [(visible)]="filterVisibleModel" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="field">
      <label for="kw">關鍵字</label>
      <input
        id="kw"
        pInputText
        type="text"
        [(ngModel)]="filter.keyword"
        placeholder="名稱／應用代碼／顯示名稱"
        (keyup.enter)="applyFilter()" />
    </div>

    <div class="field">
      <label>顯示順序（範圍）</label>
      <div class="range">
        <p-inputNumber
          [(ngModel)]="filter.displayOrderFrom"
          placeholder="從"
          [min]="0"
          [useGrouping]="false" />
        <span class="tilde">~</span>
        <p-inputNumber
          [(ngModel)]="filter.displayOrderTo"
          placeholder="到"
          [min]="0"
          [useGrouping]="false" />
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="filter-footer">
      <p-button label="重設" severity="secondary" [outlined]="true" (onClick)="resetFilter()" />
      <p-button label="套用" icon="pi pi-search" (onClick)="applyFilter()" />
    </div>
  </ng-template>
</p-drawer>
