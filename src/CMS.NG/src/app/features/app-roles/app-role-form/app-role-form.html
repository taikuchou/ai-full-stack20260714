<p-toast />

<div class="page-header">
  <div class="page-title">
    <h1>{{ isEdit() ? '編輯角色' : '新增角色' }}</h1>
    <app-row-audit-badge tableName="AppRole" [pkid]="auditPkid()" />
  </div>
  <div class="page-actions">
    <p-button label="取消" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="cancel()" />
    <p-button
      label="儲存"
      icon="pi pi-check"
      (onClick)="save()"
      [loading]="saving()"
      severity="success" />
  </div>
</div>

@if (loading()) {
  <div class="loading">載入中…</div>
} @else {
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="form-card">
      <h2>角色資料</h2>

      <div class="field">
        <label for="roleId">角色代碼 <span class="req">*</span></label>
        <input
          id="roleId"
          pInputText
          type="text"
          formControlName="roleId"
          placeholder="請輸入角色代碼"
          [class.ng-invalid-visual]="invalid('roleId')" />
        @if (invalid('roleId')) {
          <small class="err">角色代碼為必填。</small>
        }
      </div>

      <div class="field">
        <label for="roleName">角色名稱 <span class="req">*</span></label>
        <input
          id="roleName"
          pInputText
          type="text"
          formControlName="roleName"
          [class.ng-invalid-visual]="invalid('roleName')" />
        @if (invalid('roleName')) {
          <small class="err">角色名稱為必填。</small>
        }
      </div>

      <div class="field">
        <label for="permissionLevel">權限等級 <span class="req">*</span></label>
        <p-inputNumber
          inputId="permissionLevel"
          formControlName="permissionLevel"
          [min]="0"
          [useGrouping]="false" />
        @if (invalid('permissionLevel')) {
          <small class="err">請輸入有效的權限等級。</small>
        }
      </div>

      <div class="field">
        <label for="description">描述</label>
        <input id="description" pInputText type="text" formControlName="description" />
      </div>
    </div>

    <div class="form-card">
      <h2>使用者</h2>
      <div class="field">
        <p-multiSelect
          [options]="users()"
          formControlName="userIds"
          optionLabel="label"
          optionValue="id"
          placeholder="選擇使用者（可複選）"
          display="chip"
          [filter]="true"
          filterBy="label"
          [maxSelectedLabels]="9999"
          appendTo="body"
          styleClass="w-full" />
      </div>
    </div>
  </form>
}
