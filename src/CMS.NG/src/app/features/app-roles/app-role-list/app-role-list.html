<p-toast />
<p-confirmDialog />

<div class="page-card">
  <!-- Header toolbar -->
  <div class="page-header">
    <div class="page-title">
      <h1>角色 AppRole</h1>
      <span class="subtitle">使用者角色</span>
    </div>
    <div class="page-actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="openFilter()" />
      <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
    </div>
  </div>

  <!-- Data table -->
  <p-table
    [value]="roles()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    dataKey="roleId"
    styleClass="p-datatable-sm p-datatable-gridlines">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="roleId" class="key-col">角色代碼 <p-sortIcon field="roleId" /></th>
        <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
        <th pSortableColumn="permissionLevel" style="width: 9rem">
          權限等級 <p-sortIcon field="permissionLevel" />
        </th>
        <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
        <th pSortableColumn="userCount" style="width: 8rem">
          使用者數 <p-sortIcon field="userCount" />
        </th>
        <th style="width: 9rem" class="text-center">操作</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-role>
      <tr>
        <td>{{ role.pkid }}</td>
        <td class="key-col">{{ role.roleId }}</td>
        <td>{{ role.roleName }}</td>
        <td>{{ role.permissionLevel }}</td>
        <td>{{ role.description }}</td>
        <td>{{ role.userCount }}</td>
        <td class="text-center actions">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="檢視"
            (onClick)="view(role)" />
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="編輯"
            (onClick)="edit(role)" />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="刪除"
            (onClick)="confirmDelete(role)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Filter drawer -->
<p-drawer [(visible)]="filterVisibleModel" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="field">
      <label for="kw">關鍵字</label>
      <input
        id="kw"
        pInputText
        type="text"
        [(ngModel)]="filter.keyword"
        placeholder="角色代碼／名稱／描述"
        (keyup.enter)="applyFilter()" />
    </div>

    <div class="field">
      <label>權限等級（範圍）</label>
      <div class="range">
        <p-inputNumber
          [(ngModel)]="filter.permissionLevelFrom"
          placeholder="從"
          [min]="0"
          [useGrouping]="false" />
        <span class="tilde">~</span>
        <p-inputNumber
          [(ngModel)]="filter.permissionLevelTo"
          placeholder="到"
          [min]="0"
          [useGrouping]="false" />
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="filter-footer">
      <p-button label="重設" severity="secondary" [outlined]="true" (onClick)="resetFilter()" />
      <p-button label="套用" icon="pi pi-search" (onClick)="applyFilter()" />
    </div>
  </ng-template>
</p-drawer>
