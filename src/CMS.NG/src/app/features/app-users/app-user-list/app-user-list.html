<p-toast />
<p-confirmDialog />

<div class="page-card">
  <!-- Header toolbar -->
  <div class="page-header">
    <div class="page-title">
      <h1>使用者 AppUser</h1>
      <span class="subtitle">系統使用者</span>
    </div>
    <div class="page-actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="openFilter()" />
      <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
    </div>
  </div>

  <!-- Data table -->
  <p-table
    [value]="users()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    dataKey="userId"
    styleClass="p-datatable-sm p-datatable-gridlines">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="userId" class="key-col">使用者代碼 <p-sortIcon field="userId" /></th>
        <th pSortableColumn="userName">使用者名稱 <p-sortIcon field="userName" /></th>
        <th pSortableColumn="isActive" style="width: 8rem">啟用狀態 <p-sortIcon field="isActive" /></th>
        <th pSortableColumn="roleCount" style="width: 7rem">角色數 <p-sortIcon field="roleCount" /></th>
        <th pSortableColumn="passwordUpdatedTime" style="width: 12rem">
          密碼更新時間 <p-sortIcon field="passwordUpdatedTime" />
        </th>
        <th style="width: 9rem" class="text-center">操作</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.pkid }}</td>
        <td class="key-col">{{ user.userId }}</td>
        <td>{{ user.userName }}</td>
        <td>
          <p-tag
            [value]="user.isActive ? '啟用' : '停用'"
            [severity]="user.isActive ? 'success' : 'danger'" />
        </td>
        <td>{{ user.roleCount }}</td>
        <td>{{ user.passwordUpdatedTime ? (user.passwordUpdatedTime + 'Z' | date: 'yyyy-MM-dd HH:mm') : '—' }}</td>
        <td class="text-center actions">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="檢視"
            (onClick)="view(user)" />
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="編輯"
            (onClick)="edit(user)" />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="刪除"
            (onClick)="confirmDelete(user)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Filter drawer -->
<p-drawer [(visible)]="filterVisibleModel" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="field">
      <label for="kw">關鍵字</label>
      <input
        id="kw"
        pInputText
        type="text"
        [(ngModel)]="filter.keyword"
        placeholder="使用者代碼／名稱"
        (keyup.enter)="applyFilter()" />
    </div>

    <div class="field">
      <label for="active">啟用狀態</label>
      <p-select
        inputId="active"
        [options]="activeOptions"
        [(ngModel)]="filter.isActive"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="filter-footer">
      <p-button label="重設" severity="secondary" [outlined]="true" (onClick)="resetFilter()" />
      <p-button label="套用" icon="pi pi-search" (onClick)="applyFilter()" />
    </div>
  </ng-template>
</p-drawer>
