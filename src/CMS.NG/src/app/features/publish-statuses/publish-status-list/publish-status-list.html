<p-toast />
<p-confirmDialog />

<div class="page-card">
  <!-- Header toolbar -->
  <div class="page-header">
    <div class="page-title">
      <h1>發布狀態 PublishStatus</h1>
      <span class="subtitle">內容發布狀態</span>
    </div>
    <div class="page-actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="openFilter()" />
      <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
    </div>
  </div>

  <!-- Data table -->
  <p-table
    [value]="statuses()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    dataKey="pkid"
    styleClass="p-datatable-sm p-datatable-gridlines">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="pkid" class="key-col" style="width: 8rem">
          狀態代碼 <p-sortIcon field="pkid" />
        </th>
        <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
        <th pSortableColumn="isDraft" style="width: 8rem">草稿 <p-sortIcon field="isDraft" /></th>
        <th pSortableColumn="isPublished" style="width: 8rem">
          已發布 <p-sortIcon field="isPublished" />
        </th>
        <th pSortableColumn="isDiscontinued" style="width: 8rem">
          已停用 <p-sortIcon field="isDiscontinued" />
        </th>
        <th style="width: 9rem" class="text-center">操作</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-status>
      <tr>
        <td class="key-col">{{ status.pkid }}</td>
        <td>{{ status.description }}</td>
        <td>
          <p-tag
            [value]="status.isDraft ? '是' : '否'"
            [severity]="status.isDraft ? 'success' : 'secondary'" />
        </td>
        <td>
          <p-tag
            [value]="status.isPublished ? '是' : '否'"
            [severity]="status.isPublished ? 'success' : 'secondary'" />
        </td>
        <td>
          <p-tag
            [value]="status.isDiscontinued ? '是' : '否'"
            [severity]="status.isDiscontinued ? 'danger' : 'secondary'" />
        </td>
        <td class="text-center actions">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            pTooltip="檢視"
            (onClick)="view(status)" />
          <p-button
            icon="pi pi-pencil"
            severity="info"
            [text]="true"
            [rounded]="true"
            pTooltip="編輯"
            (onClick)="edit(status)" />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="刪除"
            (onClick)="confirmDelete(status)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Filter drawer -->
<p-drawer [(visible)]="filterVisibleModel" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="field">
      <label for="kw">關鍵字</label>
      <input
        id="kw"
        pInputText
        type="text"
        [(ngModel)]="filter.keyword"
        placeholder="狀態說明"
        (keyup.enter)="applyFilter()" />
    </div>

    <div class="field">
      <label for="isDraft">草稿</label>
      <p-select
        inputId="isDraft"
        [options]="tristateOptions"
        [(ngModel)]="filter.isDraft"
        optionLabel="label"
        optionValue="value"
        appendTo="body" />
    </div>

    <div class="field">
      <label for="isPublished">已發布</label>
      <p-select
        inputId="isPublished"
        [options]="tristateOptions"
        [(ngModel)]="filter.isPublished"
        optionLabel="label"
        optionValue="value"
        appendTo="body" />
    </div>

    <div class="field">
      <label for="isDiscontinued">已停用</label>
      <p-select
        inputId="isDiscontinued"
        [options]="tristateOptions"
        [(ngModel)]="filter.isDiscontinued"
        optionLabel="label"
        optionValue="value"
        appendTo="body" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="filter-footer">
      <p-button label="重設" severity="secondary" [outlined]="true" (onClick)="resetFilter()" />
      <p-button label="套用" icon="pi pi-search" (onClick)="applyFilter()" />
    </div>
  </ng-template>
</p-drawer>
