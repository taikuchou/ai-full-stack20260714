<p-toast />

<div class="page-header">
  <div class="page-title">
    <h1>{{ isEdit() ? '編輯發布狀態' : '新增發布狀態' }}</h1>
    <app-row-audit-badge tableName="PublishStatus" [pkid]="auditPkid()" />
  </div>
  <div class="page-actions">
    <p-button label="取消" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="cancel()" />
    <p-button
      label="儲存"
      icon="pi pi-check"
      (onClick)="save()"
      [loading]="saving()"
      severity="success" />
  </div>
</div>

@if (loading()) {
  <div class="loading">載入中…</div>
} @else {
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="form-card">
      <h2>發布狀態資料</h2>

      <div class="field">
        <label for="pkid">狀態代碼 <span class="req">*</span></label>
        <p-inputNumber
          inputId="pkid"
          formControlName="pkid"
          [min]="0"
          [max]="255"
          [useGrouping]="false" />
        @if (isEdit()) {
          <small class="hint">狀態代碼為主鍵，建立後不可修改。</small>
        }
        @if (invalid('pkid')) {
          <small class="err">請輸入 0–255 的狀態代碼。</small>
        }
      </div>

      <div class="field">
        <label for="description">狀態說明 <span class="req">*</span></label>
        <input
          id="description"
          pInputText
          type="text"
          formControlName="description"
          maxlength="50"
          placeholder="請輸入狀態說明"
          [class.ng-invalid-visual]="invalid('description')" />
        @if (invalid('description')) {
          <small class="err">狀態說明為必填（最多 50 字）。</small>
        }
      </div>

      <div class="field-inline">
        <label for="isDraft">草稿</label>
        <p-toggleswitch inputId="isDraft" formControlName="isDraft" />
      </div>

      <div class="field-inline">
        <label for="isPublished">已發布</label>
        <p-toggleswitch inputId="isPublished" formControlName="isPublished" />
      </div>

      <div class="field-inline">
        <label for="isDiscontinued">已停用</label>
        <p-toggleswitch inputId="isDiscontinued" formControlName="isDiscontinued" />
      </div>
    </div>
  </form>
}
