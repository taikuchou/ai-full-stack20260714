<div class="page-header">
  <div class="page-title">
    <h1>檢視發布狀態</h1>
  </div>
  <div class="page-actions">
    <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (onClick)="back()" />
    <p-button label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
  </div>
</div>

@if (loading()) {
  <div class="loading">載入中…</div>
} @else if (status(); as s) {
  <div class="detail-card">
    <h2>發布狀態資料</h2>
    <dl class="detail-grid">
      <dt>狀態代碼</dt>
      <dd>{{ s.pkid }}</dd>

      <dt>狀態說明</dt>
      <dd>{{ s.description }}</dd>

      <dt>草稿</dt>
      <dd><p-tag [value]="s.isDraft ? '是' : '否'" [severity]="s.isDraft ? 'success' : 'secondary'" /></dd>

      <dt>已發布</dt>
      <dd><p-tag [value]="s.isPublished ? '是' : '否'" [severity]="s.isPublished ? 'success' : 'secondary'" /></dd>

      <dt>已停用</dt>
      <dd><p-tag [value]="s.isDiscontinued ? '是' : '否'" [severity]="s.isDiscontinued ? 'danger' : 'secondary'" /></dd>
    </dl>
  </div>
} @else {
  <div class="loading">查無此發布狀態。</div>
}
